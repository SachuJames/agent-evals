[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sachu-agent-evals"
version = "0.1.0"
description = "Eval harness for AI agents: YAML task suites, pluggable runners, tool-use loop, scorers, trace capture, regression tracking"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "rich>=13.0",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/SachuJames/agent-evals"
Repository = "https://github.com/SachuJames/agent-evals"
Issues = "https://github.com/SachuJames/agent-evals/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.0"]

[project.scripts]
agent-evals = "agent_evals.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_evals*"]

[tool.setuptools.package-data]
agent_evals = ["builtin_tasks/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
